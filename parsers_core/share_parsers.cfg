# ============================================================
#  share_parsers.cfg — общие параметры для всех парсеров
#  Логика: [BROWSER] — база по умолчанию для всех.
#  Если у парсера есть своя секция — она перекрывает нужные
#  значения, остальное берётся из [BROWSER].
# ============================================================

[BROWSER]
min_delay    = 1.0
max_delay    = 3.0

# browser_size: управляет окном браузера
#   0          — обычный режим, 1920x1080
#  -1          — headless (браузер невидим, быстрее)
# 1920x1080   — Full HD (стандартный монитор)
# 1366x768    — HD (распространённый ноутбук)
# 1280x900    — MacBook 13"
# 1440x900    — широкоформатный ноутбук
# 375x812     — эмуляция мобильного (iPhone X)
# browser_size = 0
browser_size = 375x812

# ──────────────────────────────────────────────────────────
# Секции ниже — опциональные переопределения для конкретных
# парсеров. Если секции нет — парсер использует [BROWSER].
# Раскомментируй нужную секцию и задай свои значения.
# ──────────────────────────────────────────────────────────

# [WINESTREET]
# min_delay    = 2.0
# max_delay    = 5.0
# browser_size = -1

# [ALKOTEKA]
